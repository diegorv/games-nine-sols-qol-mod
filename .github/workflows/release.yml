name: release

# Run from the Actions tab (Run workflow, on main): tags main's latest commit with the next version
# and starts the build workflow on that tag, which makes the GitHub release and uploads to
# Thunderstore. A tag pushed with the workflow's own token does not trigger other workflows, so
# this starts build.yml itself (workflow_dispatch is the exception GitHub allows).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version goes up (1.2.3 → patch 1.2.4, minor 1.3.0, major 2.0.0)
        type: choice
        options: [ patch, minor, major ]
        default: patch

permissions:
  contents: write
  actions: write

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version and the notes read the tags and commits
          fetch-depth: 0
      - name: Next version
        id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          IFS=. read -r major minor patch <<< "${last:-v0.0.0}"
          major=${major#v}
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          tag="v$major.$minor.$patch"

          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi
          # The same commits the changelog lists: nothing to release without them
          if [ -n "$last" ] && [ -z "$(git log --format=%h "$last..HEAD" -- Source thunderstore)" ]; then
            echo "::error::No changes to Source/ or thunderstore/ since $last"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "$last → $tag"
      - name: Tag
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "NineSolsQoL ${TAG#v}"
          git push origin "$TAG"
      - name: Start the release build
        env:
          TAG: ${{ steps.next.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref "$TAG"
      - name: Summary
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          {
            echo "## $TAG"
            echo
            echo "Tagged $(git rev-parse --short HEAD). The **build** workflow on $TAG makes the release and"
            echo "uploads it to Thunderstore: [Actions](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/build.yml)."
            echo
            echo "### Changes"
            echo
            scripts/changelog.sh notes "$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
