[config]
schemaVersion = "0.0.1"

[package]
namespace = "diegorv"
name = "NineSolsQoL"
# The build passes the .csproj's <Version> (in CI, the release tag's) with --package-version
versionNumber = "1.0.0"
description = "Quality of life tweaks, each optional in the F1 menu: respawn near death, no death penalty, easier perfect parry, parry from behind, dash invulnerability, fast heal, loot magnet, Jin multipliers, boss HP numbers, teleport from any Root Node."
websiteUrl = "https://github.com/diegorv/games-nine-sols-qol-mod"
containsNsfwContent = false

[package.dependencies]
"BepInEx-BepInExPack" = "5.4.2305"
"ninesolsmodding-NineSolsAPI" = "1.3.1"
"ninesolsmodding-BepinExConfigurationManager" = "18.3.1"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "build/files"
target = "."

[publish]
repository = "https://thunderstore.io"
communities = [ "nine-sols" ]

[publish.categories]
nine-sols = [ "mods" ]
