[config]
schemaVersion = "0.0.1"

[package]
namespace = "yournamespace"
name = "NineSolsQoL"
versionNumber = "0.1.0"
description = "Quality of life tweaks for Nine Sols, each one optional. Respawn near where you died instead of at the last Root Node."
websiteUrl = "link to the git repo"
containsNsfwContent = false

[package.dependencies]
"BepInEx-BepInExPack" = "5.4.2100"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "build/dll"
target = "."

[publish]
repository = "https://thunderstore.io"
communities = [ "nine-sols" ]
